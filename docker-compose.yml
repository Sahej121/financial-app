version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: financial_app_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-financial_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: financial_app_cache
    ports:
      - "6379:6379"

  server:
    build: ./server
    container_name: financial_app_server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-financial_app}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      - postgres
      - redis

  client:
    build: ./client
    container_name: financial_app_client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
